name: ja_wifi_manager
description: JA WiFi Hotspot Guard - Windows Desktop App for managing Mobile Hotspot whitelisting
publish_to: 'none'
version: 1.1.6+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  path: ^1.9.0
  file_picker: ^8.0.0+1
  window_manager: ^0.5.1
  flutter_acrylic: ^1.1.4
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
